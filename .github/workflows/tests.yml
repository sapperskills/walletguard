name: tests

on:
  push:
    branches: [main]  # PR branches are covered by pull_request; don't run twice
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests (standard library only, nothing to install)
        run: python -m unittest discover -s tests -v
